[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "kernel-compiler"
version = "0.1.0"
description = "Exact Python proof authoring over the native Rust compiler core"
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "../crates/python/Cargo.toml"
python-source = "."
module-name = "kernel_compiler._native"
