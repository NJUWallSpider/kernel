[package]
autotests = false
name = "kernel-core"
version.workspace = true
edition.workspace = true

[dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }

[[bin]]
name = "rpx"
path = "src/main.rs"

[[test]]
name = "cli_limits"
path = "tests/cli_limits.rs"

[[test]]
name = "mi_opt"
path = "tests/mi_opt.rs"

[[test]]
name = "rpa"
path = "tests/rpa.rs"
