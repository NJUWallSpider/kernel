[package]
name = "kernel-core"
version.workspace = true
edition.workspace = true

[dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "rpx"
path = "src/main.rs"
