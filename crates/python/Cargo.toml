[package]
name = "kernel-compiler-python"
version.workspace = true
edition.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
kernel-compiler-core = { path = "../compiler-core" }
kernel-core = { path = "../core" }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py39", "num-bigint", "multiple-pymethods"] }
serde_json = "1"
